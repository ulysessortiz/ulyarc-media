[build]
  command = "test -f ULYARC_HQ_IV_LIVING_MIRROR_TYPOGRAPHY_PASS_NETLIFY_READY.zip && rm -rf .netlify-dist && mkdir -p .netlify-dist && unzip -q -o ULYARC_HQ_IV_LIVING_MIRROR_TYPOGRAPHY_PASS_NETLIFY_READY.zip -d .netlify-dist"
  publish = ".netlify-dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; manifest-src 'self'; media-src 'self'; upgrade-insecure-requests"
